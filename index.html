<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Undangan Pernikahan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bgMusic" src="music.mp3" loop></audio>

<div class="slides">

  <!-- COVER -->
  <section class="slide cover">
    <p>Kepada Yth.</p>
    <h2 id="guestName">Tamu Undangan</h2>
    <h1>The Wedding Of</h1>
    <h3>Sulthan & Ketrin</h3>
    <button id="openBtn">Buka Undangan</button>
  </section>

  <!-- MEMPELAI -->
  <section class="slide dark">
    <h1>Sulthan</h1>
    <p>Putra dari Bapak & Ibu</p>
    <span>&</span>
    <h1>Ketrin</h1>
    <p>Putri dari Bapak & Ibu</p>
  </section>

  <!-- ACARA -->
  <section class="slide light">
    <h2>Akad Nikah</h2>
    <p>Sabtu, 20 Januari 2026</p>
    <p>09.00 WIB</p>

    <h2>Resepsi</h2>
    <p>11.00 WIB - Selesai</p>
    <p>Gedung Serbaguna</p>
  </section>

  <!-- GALERI -->
  <section class="slide dark">
    <h2>Galeri Foto</h2>
    <div class="gallery">
      <img src="https://iili.io/fXvuda2.jpg">
      <img src="https://iili.io/fXvuNMG.jpg">
      <img src="https://iili.io/fXvaNV9.jpg">
    </div>
  </section>

  <!-- PENUTUP -->
  <section class="slide cover">
    <h2>Terima Kasih</h2>
    <p>Atas doa dan kehadiran Anda</p>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
