<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Undangan Pernikahan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="slides-container">

  <!-- COVER -->
  <section class="slide cover" id="cover">
    <h4>Kepada Yth.</h4>
    <h2 id="guestName">Tamu Undangan</h2>
    <h1>The Wedding of</h1>
    <h3>[Sulthan] & [Ketrin]</h3>
    <button onclick="startInvite()">Buka Undangan</button>
  </section>

  <!-- INFO ACARA -->
  <section class="slide info">
    <h2>Informasi Acara</h2>
    <div class="event">
      <p><strong>Akad Nikah:</strong> Sabtu, 20 Januari 2026 – 09:00</p>
      <p><strong>Resepsi:</strong> Sabtu, 20 Januari 2026 – 11:00</p>
      <p><strong>Tempat:</strong> Gedung Serbaguna</p>
    </div>
  </section>

  <!-- COUNTDOWN -->
  <section class="slide countdown-slide">
    <h2>Countdown</h2>
    <div id="countdown"></div>
  </section>

  <!-- GALERI -->
  <section class="slide gallery-slide">
    <h2>Galeri Foto</h2>
    <div class="gallery">
      <img src="https://iili.io/fXvuda2.jpg" onclick="openLightbox(this.src)">
      <img src="https://iili.io/fXvuNMG.jpg" onclick="openLightbox(this.src)">
      <img src="https://iili.io/fXvaNV9.jpg" onclick="openLightbox(this.src)">
      <img src="https://iili.io/fXvckXI.jpg" onclick="openLightbox(this.src)">
    </div>
  </section>

  <!-- RSVP -->
  <section class="slide rsvp-slide">
    <h2>Konfirmasi Kehadiran</h2>
    <form onsubmit="submitRSVP(event)">
      <input id="rsvpName" type="text" placeholder="Nama Anda" required>
      <select id="rsvpStatus">
        <option>Hadir</option>
        <option>Tidak Hadir</option>
      </select>
      <button type="submit">Kirim</button>
    </form>
  </section>

</div>

<div id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg">
</div>

<script src="script.js"></script>
</body>
</html>
